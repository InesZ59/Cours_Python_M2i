# stockline.conf — site nginx : reverse proxy vers l'API StockLine Lite
# Destination sur le serveur : /etc/nginx/sites-available/stockline.conf
#
# Installation :
#   sudo cp stockline.conf /etc/nginx/sites-available/stockline.conf
#   sudo ln -s /etc/nginx/sites-available/stockline.conf /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
 
server {
    # nginx écoute sur le port 80 pour toutes les interfaces ;
    # default_server : ce site répond même sans nom de domaine
    listen 80 default_server;
    # « _ » = accepter n'importe quel nom d'hôte (pas encore de DNS ici)
    server_name _;
 
    location / {
        # Tout le trafic est relayé vers uvicorn, qui n'écoute qu'en local :
        # l'application Python n'est JAMAIS exposée directement à Internet
        proxy_pass http://127.0.0.1:8000;
 
        # En-têtes transmis à l'application pour qu'elle sache
        # qui est le vrai client derrière le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
 